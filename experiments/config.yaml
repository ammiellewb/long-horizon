# Configuration for TextQuests experiments
openrouter:
  # MODEL IDENTITY — single source of truth. runner.resolve_model() resolves the
  # id with this precedence, highest first:
  #   1. OPENROUTER_MODEL env var   (the operator's override for one process)
  #   2. openrouter.model below     (the checked-in default)
  # Both OPENROUTER_MODEL and INSPECT_EVAL_MODEL (which configures inspect-ai,
  # not this runner) are cross-checked against this value whatever their
  # precedence: if any of them names a different model the run ABORTS with
  # ModelConfigError. There is no default and no fallback — a missing id is also
  # a hard error. The resolved id and its source are written into every run log
  # (summary.model / summary.model_source).
  model: "anthropic/claude-sonnet-5"
  base_url: "https://openrouter.ai/api/v1"
  request_timeout: 60
experiments:
  max_steps: 500
  autosave_every: 1
  accepted_local_error_k: 3
  info_seek_window: 10
  games: ["zork1", "wishbringer"]

  # Hard stops, recorded in summary.stop_reason (see logger.STOP_REASONS)
  max_total_tokens: null    # cost cap: stop at this many cumulative tokens -> 'cost_cap'. null = off
  max_invalid_actions: 10   # consecutive unusable model responses before 'invalid_action_cap'. null = off

  # Rolling-window context truncation (truncation, NOT summarization — the M2
  # memory mechanism is ablated separately and must stay the only memory help).
  context:
    window_tokens: null     # the model's own context window, in tokens.
                            # REQUIRED for proactive truncation; null = reactive
                            # overflow recovery only. Set it to the window of the
                            # model named above (it is model-specific, so there is
                            # deliberately no default to get silently wrong).
    output_reserve: 288     # tokens held back for one turn's output (~1.5 x the 192 step cap)
    budget_tokens: null     # absolute budget override; wins over window_tokens - output_reserve
    max_overflow_rounds: 8  # evict-and-retry rounds before giving up with 'context_exhausted'

  # Composite drift detector: stagnation + behavioral loops + reasoning coherence
  drift:
    enabled: true
    window: 20          # steps in the rolling window
    threshold: 0.65     # composite score at or above which drift is flagged
    w_stagnation: 0.50  # weight: no progress increase in window
    w_loop: 0.30        # weight: repetitive action sequences
    w_coherence: 0.20   # weight: vague vs. goal-directed reasoning

  # M2 harness mechanism: structured memory scratchpad (on/off via mechanisms.m2_memory)
  memory:
    max_visited: 25       # max locations to show in the scratchpad
    max_discoveries: 10   # max discoveries to retain

  # Budget/liveness channel (M4's primary target): loops/stalls/overspend, pure arithmetic
  budget:
    enabled: true
    token_budget: null          # null = no hard token cap, ratio stays 0
    stall_token_threshold: 4000 # tokens since last progress increase considered "stalled"
    w_step: 0.3    # weight: steps_used / max_steps
    w_token: 0.3   # weight: tokens_used / token_budget (0 if no budget set)
    w_stall: 0.4   # weight: tokens burned since last progress increase / stall_token_threshold
    threshold: 0.7 # composite risk at or above which budget/liveness is flagged

  # Integration channel (M6's primary target): known pieces never combined
  integration:
    enabled: true
    min_unused: 2      # unused discoveries/inventory items needed to trip the pre-filter
    recent_window: 10  # how many recent actions count as "referenced"

  # Master switches for each harness mechanism (independent of channel-detector logging above)
  mechanisms:
    m1_info_seeking: true      # lead: prompted correction on confirmed ALE
    m2_memory: true            # structured scratchpad
    m3_state_ext: true         # ground-truth location/inventory probe
    m4_adaptive: true          # risk-vector -> mechanism-bundle dispatch
    m5_action_templating: true # normalize_action guardrail before env.step
    m6_planning: true          # LLM replan on integration gap or sustained drift
logs:
  out_dir: "./experiments/logs"
scout:
  project: "textquests"
